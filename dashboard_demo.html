<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dunes Dictionary Dashboard - 中台系统</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .chart-container { position: relative; height: 100%; width: 100%; }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-900">

    <div class="min-h-screen p-4 md:p-8">
        <div class="max-w-7xl mx-auto">
            
            <!-- Header -->
            <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
                <div>
                    <h1 class="text-3xl font-extrabold text-slate-800 tracking-tight">Dunes Dictionary <span class="text-indigo-600 font-medium">中台系统</span></h1>
                    <p class="text-slate-500 mt-1">实时监控词条表现与前台交互指标</p>
                </div>
                <div class="flex items-center gap-3">
                    <div class="flex bg-white p-1 rounded-xl shadow-sm border border-slate-200">
                        <button class="px-4 py-2 text-sm font-medium bg-slate-100 text-slate-800 rounded-lg">全部</button>
                        <button class="px-4 py-2 text-sm font-medium text-slate-500 hover:text-slate-800">中文</button>
                        <button class="px-4 py-2 text-sm font-medium text-slate-500 hover:text-slate-800">EN</button>
                    </div>
                </div>
            </header>

            <!-- Stats Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                <!-- Stat Card 1 -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col gap-2">
                    <div class="flex justify-between items-start">
                        <div class="p-2 rounded-lg bg-blue-500 bg-opacity-10 text-blue-500">
                            <i data-lucide="users" class="w-5 h-5"></i>
                        </div>
                        <span class="text-xs font-medium text-emerald-500 bg-emerald-50 px-2 py-1 rounded-full">+12.5%</span>
                    </div>
                    <div class="mt-2">
                        <p class="text-slate-500 text-sm font-medium">昨日访问量</p>
                        <h3 class="text-2xl font-bold text-slate-800">1,284</h3>
                    </div>
                </div>
                <!-- Stat Card 2 -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col gap-2">
                    <div class="flex justify-between items-start">
                        <div class="p-2 rounded-lg bg-purple-500 bg-opacity-10 text-purple-500">
                            <i data-lucide="clock" class="w-5 h-5"></i>
                        </div>
                        <span class="text-xs font-medium text-emerald-500 bg-emerald-50 px-2 py-1 rounded-full">+3.2%</span>
                    </div>
                    <div class="mt-2">
                        <p class="text-slate-500 text-sm font-medium">平均停留时长</p>
                        <h3 class="text-2xl font-bold text-slate-800">4m 32s</h3>
                    </div>
                </div>
                <!-- Stat Card 3 -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col gap-2">
                    <div class="flex justify-between items-start">
                        <div class="p-2 rounded-lg bg-green-500 bg-opacity-10 text-green-500">
                            <i data-lucide="book-open" class="w-5 h-5"></i>
                        </div>
                        <span class="text-xs font-medium text-emerald-500 bg-emerald-50 px-2 py-1 rounded-full">+5.1%</span>
                    </div>
                    <div class="mt-2">
                        <p class="text-slate-500 text-sm font-medium">活跃词条数</p>
                        <h3 class="text-2xl font-bold text-slate-800">452</h3>
                    </div>
                </div>
                <!-- Stat Card 4 -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col gap-2">
                    <div class="flex justify-between items-start">
                        <div class="p-2 rounded-lg bg-orange-500 bg-opacity-10 text-orange-500">
                            <i data-lucide="globe" class="w-5 h-5"></i>
                        </div>
                        <span class="text-xs font-medium text-emerald-500 bg-emerald-50 px-2 py-1 rounded-full">+0.8%</span>
                    </div>
                    <div class="mt-2">
                        <p class="text-slate-500 text-sm font-medium">全域访问</p>
                        <h3 class="text-2xl font-bold text-slate-800">84%</h3>
                    </div>
                </div>
            </div>

            <!-- Charts Section -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
                <div class="lg:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                    <div class="flex items-center justify-between mb-6">
                        <h3 class="font-bold text-slate-800 text-lg flex items-center gap-2">
                            <i data-lucide="trending-up" class="w-5 h-5 text-indigo-500"></i>
                            流量访问趋势 (7 Days)
                        </h3>
                    </div>
                    <div class="h-72 w-full">
                        <canvas id="trendChart"></canvas>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                    <h3 class="font-bold text-slate-800 text-lg mb-6 flex items-center gap-2">
                        <i data-lucide="activity" class="w-5 h-5 text-pink-500"></i>
                        交互功能分布
                    </h3>
                    <div class="space-y-6" id="feature-distribution">
                        <!-- Bars populated by JS or static -->
                        <div>
                            <div class="flex justify-between items-center mb-2">
                                <div class="flex items-center gap-2">
                                    <i data-lucide="search" class="w-4 h-4 text-slate-400"></i>
                                    <span class="text-sm font-medium text-slate-600">搜索点击率</span>
                                </div>
                                <span class="text-sm font-bold text-slate-800">65%</span>
                            </div>
                            <div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
                                <div class="h-full bg-indigo-500 rounded-full" style="width: 65%"></div>
                            </div>
                        </div>
                        <div>
                            <div class="flex justify-between items-center mb-2">
                                <div class="flex items-center gap-2">
                                    <i data-lucide="shuffle" class="w-4 h-4 text-slate-400"></i>
                                    <span class="text-sm font-medium text-slate-600">随机词条 (Shuffle)</span>
                                </div>
                                <span class="text-sm font-bold text-slate-800">28%</span>
                            </div>
                            <div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
                                <div class="h-full bg-pink-500 rounded-full" style="width: 28%"></div>
                            </div>
                        </div>
                        <div>
                            <div class="flex justify-between items-center mb-2">
                                <div class="flex items-center gap-2">
                                    <i data-lucide="download" class="w-4 h-4 text-slate-400"></i>
                                    <span class="text-sm font-medium text-slate-600">词条导出</span>
                                </div>
                                <span class="text-sm font-bold text-slate-800">12%</span>
                            </div>
                            <div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
                                <div class="h-full bg-emerald-500 rounded-full" style="width: 12%"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Table Section -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                <div class="p-6 border-b border-slate-100 flex items-center justify-between">
                    <h3 class="font-bold text-slate-800 text-lg">词条活跃度排行</h3>
                    <button class="text-sm text-indigo-600 font-semibold hover:text-indigo-700">导出报表</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead>
                            <tr class="bg-slate-50/50 text-slate-400 text-xs uppercase tracking-wider font-semibold">
                                <th class="px-6 py-4">词条名称</th>
                                <th className="px-6 py-4">分类</th>
                                <th class="px-6 py-4">浏览次数</th>
                                <th class="px-6 py-4">阅读时长 (Sum)</th>
                                <th class="px-6 py-4 text-right">操作</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100" id="term-table-body">
                            <!-- JS will populate this -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div id="termModal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-2xl shadow-2xl overflow-hidden">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                <h2 id="modalTitle" class="text-xl font-bold text-slate-800">词条详情</h2>
                <button onclick="closeModal()" class="p-2 hover:bg-white rounded-full transition-colors border border-transparent hover:border-slate-200">
                    <i data-lucide="x" class="w-5 h-5 text-slate-400"></i>
                </button>
            </div>
            <div class="p-8">
                <div class="grid grid-cols-3 gap-6 mb-8 text-center">
                    <div>
                        <p class="text-slate-400 text-xs mb-1 uppercase tracking-wider font-semibold">总浏览量</p>
                        <p id="modalVisits" class="text-2xl font-bold text-slate-800">-</p>
                    </div>
                    <div>
                        <p class="text-slate-400 text-xs mb-1 uppercase tracking-wider font-semibold">累计时长</p>
                        <p id="modalDuration" class="text-2xl font-bold text-slate-800">-</p>
                    </div>
                    <div>
                        <p class="text-slate-400 text-xs mb-1 uppercase tracking-wider font-semibold">活跃天数</p>
                        <p id="modalActiveDays" class="text-2xl font-bold text-slate-800">-</p>
                    </div>
                </div>
                <div class="h-64 w-full">
                    <canvas id="detailChart"></canvas>
                </div>
                <p class="text-center text-slate-400 text-sm mt-4 italic font-light">近五日活跃趋势分析</p>
            </div>
        </div>
    </div>

    <script>
        // --- Data ---
        const termData = [
            { id: 1, term: 'Rational Ignorance', category: 'Economics', visits: 1205, duration: '120h', activeDays: 28, trend: [10, 20, 15, 30, 25] },
            { id: 2, term: 'Affordance', category: 'Design', visits: 980, duration: '85h', activeDays: 25, trend: [5, 10, 40, 20, 35] },
            { id: 3, term: 'Survivor Bias', category: 'Psychology', visits: 850, duration: '92h', activeDays: 22, trend: [30, 25, 20, 15, 10] },
            { id: 4, term: 'Lindey Effect', category: 'Philosophy', visits: 720, duration: '45h', activeDays: 18, trend: [2, 8, 15, 25, 45] },
        ];

        // --- Initialize Icons ---
        lucide.createIcons();

        // --- Trend Chart ---
        const trendCtx = document.getElementById('trendChart').getContext('2d');
        new Chart(trendCtx, {
            type: 'line',
            data: {
                labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                datasets: [
                    {
                        label: '中文访问',
                        data: [400, 300, 200, 278, 189, 239, 349],
                        borderColor: '#6366f1',
                        borderWidth: 3,
                        tension: 0.4,
                        fill: false,
                        pointBackgroundColor: '#fff',
                        pointBorderWidth: 2
                    },
                    {
                        label: 'EN Visits',
                        data: [240, 139, 980, 390, 480, 380, 430],
                        borderColor: '#94a3b8',
                        borderWidth: 3,
                        borderDash: [5, 5],
                        tension: 0.4,
                        fill: false,
                        pointBackgroundColor: '#fff',
                        pointBorderWidth: 2
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { position: 'bottom' } },
                scales: {
                    y: { grid: { display: false }, border: { display: false } },
                    x: { grid: { display: false }, border: { display: false } }
                }
            }
        });

        // --- Populate Table ---
        const tableBody = document.getElementById('term-table-body');
        termData.forEach(item => {
            const row = document.createElement('tr');
            row.className = 'hover:bg-slate-50/80 transition-colors group';
            row.innerHTML = `
                <td class="px-6 py-4 font-bold text-slate-700">${item.term}</td>
                <td class="px-6 py-4">
                    <span class="px-2 py-1 bg-slate-100 text-slate-500 text-xs rounded-md font-medium">${item.category}</span>
                </td>
                <td class="px-6 py-4 text-slate-600 font-medium">${item.visits.toLocaleString()}</td>
                <td class="px-6 py-4 text-slate-600 font-medium">${item.duration}</td>
                <td class="px-6 py-4 text-right">
                    <button onclick="openModal(${item.id})" class="p-2 hover:bg-white rounded-lg border border-transparent hover:border-slate-200 text-slate-400 hover:text-indigo-600 transition-all">
                        <i data-lucide="chevron-right" class="w-5 h-5"></i>
                    </button>
                </td>
            `;
            tableBody.appendChild(row);
        });
        lucide.createIcons(); // Re-run for new rows

        // --- Modal Logic ---
        let detailChart = null;

        function openModal(id) {
            const item = termData.find(t => t.id === id);
            document.getElementById('modalTitle').innerText = `词条详情: ${item.term}`;
            document.getElementById('modalVisits').innerText = item.visits;
            document.getElementById('modalDuration').innerText = item.duration;
            document.getElementById('modalActiveDays').innerText = item.activeDays;
            
            document.getElementById('termModal').classList.remove('hidden');

            const ctx = document.getElementById('detailChart').getContext('2d');
            if (detailChart) detailChart.destroy();

            detailChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Day 1', 'Day 2', 'Day 3', 'Day 4', 'Day 5'],
                    datasets: [{
                        data: item.trend,
                        borderColor: '#6366f1',
                        backgroundColor: 'rgba(99, 102, 241, 0.1)',
                        fill: true,
                        tension: 0.4,
                        borderWidth: 3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { display: false },
                        x: { grid: { display: false } }
                    }
                }
            });
        }

        function closeModal() {
            document.getElementById('termModal').classList.add('hidden');
        }

        // Close modal on click outside
        window.onclick = function(event) {
            const modal = document.getElementById('termModal');
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
