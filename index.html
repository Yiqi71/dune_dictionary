<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沙丘词典</title>
    <!-- 
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700&display=swap" rel="stylesheet"> -->

    <link rel="stylesheet" href="resetCSS.css">
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="floatingPanel.css">
    <link rel="stylesheet" href="menu.css">

    <script type="module" src="uni-canvas.js" defer></script>
    <script type="module" src="main.js" defer></script>
    <script type="module" src="wordFocus.js" defer></script>
    <script type="module" src="relationManager.js" defer></script>
    <script type="module" src="state.js" defer></script>
    <script type="module" src="countryBoundingBoxes.js" defer></script>
    <script type="module" src="menu.js" defer></script>
</head>

<body>
    <!-- <div id="center-dot"></div> -->

    <button id="lang-toggle-btn" style="
    position: fixed;
    top: 10px;
    left: 10px;
    z-index: 1000;
    padding: 6px 12px;
    background-color: #FFD700;
    border: none;
    border-radius: 4px;
    cursor: pointer;
">
        中文
    </button>

    <div id="floating-panel" class="hidden">
        <div class="panel-main">
            <div class="panel-top"></div>
            <div class="panel-bottom"></div>
        </div>

        <div class="panel-slide">
            <div class="scroll-track"></div>
            <div class="scroll-thumb"></div>
        </div>

        <div class="panel-tabs">
            <button data-tab="entry" class="active">词条</button>
            <button data-tab="comment">笔记</button>
        </div>
    </div>

    <menu id="side-menu">
        <div id="upper-menu">
            <div id="dunes-icon">
                <h2 class="Chinese">沙丘 词典</h2>
                <h2 class="English">Dunes Dictionary</h2>
            </div>
            <div id="buttons">
                <div class="small-icon">
                    <img id="shuffle-icon" alt="shuffle" src="./icons/shuffle.svg">
                </div>
                <div class="small-icon">
                    <img id="search-icon" alt="search" src="./icons/search.svg">
                </div>
                <div id="about-button">
                    <p>About</p>
                </div>
            </div>

        </div>

        <div id="lower-menu">
            <img id="min" alt="" src="./icons/min.svg">
            <div id="scaleContainer">
                <div id="scale">
                    <div class="scale-line"></div>
                    <div class="scale-ticks"></div>
                    <div id="indicator" class="scale-indicator"></div>
                </div>
                <div class="scale-numbers"></div>
            </div>
            <img id="max" alt="" src="./icons/max.svg">
        </div>

        <div id="year-menu">
            <div id="yearContainer">
                <!-- Background segments -->
                <div class="year-segments">
                    <div class="year-segment"></div>
                    <div class="year-segment"></div>
                    <div class="year-segment"></div>
                    <div class="year-segment"></div>
                    <div class="year-segment"></div>
                    <div class="year-segment"></div>
                </div>

                <!-- Vertical tick marks -->
                <div class="year-ticks"></div>

                <!-- Year indicator -->
                <div id="yearIndicator" class="year-indicator"></div>

                <!-- Year labels -->
                <div class="year-numbers"></div>
            </div>
        </div>
    </menu>

    <!-- 主视图 -->
    <div id="universe-view" class="view">
        <canvas id="universe-canvas"></canvas>
        <svg id="connection-lines"></svg>
        <!-- details -->
        <div id="word-details" class="hidden">
            <div class="detail" id="image">
                <div class="detail-title"></div>
                <img alt="">
            </div>
            <div class="detail" id="proposer">
                <div class="detail-title"></div>
                <p>proposer's name</p>
                <img alt="proposer's img">
            </div>
            <div class="detail" id="comment">
                <div class="detail-title"></div>
                <div id="comment-content">

                </div>
            </div>
            <!-- <div class="detail" id="term">
                <div class="detail-title"></div>
                <div class="terms">
                    <div class="term-main Chinese"></div>
                    <div class="term-ori English"></div>
                </div>
            </div> -->
        </div>
        <div id="word-nodes-container"></div>
    </div>

    <div id="overlay" class="hidden"></div>

    <!-- Search Modal -->
    <div id="search-modal" class="search-modal hidden">
        <div class="search-modal-content">
            <input type="text" id="search-input" placeholder="Search terms..." autocomplete="off">
            <div id="search-results" class="search-results"></div>
        </div>
    </div>

    <div id="tooltipDiv"></div>
</body>

</html>
